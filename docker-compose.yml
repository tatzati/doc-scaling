services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scalability
      POSTGRES_USER: scalability
      POSTGRES_PASSWORD: scalability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalability -d scalability"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://scalability:scalability@postgres:5432/scalability
      PROCESSING_DELAY_SECONDS: 0.25
      ENVIRONMENT: docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
